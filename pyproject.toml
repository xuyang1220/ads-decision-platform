[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ads-decision-platform"
version = "0.1.0"
description = "Starter codebase for a production-oriented ads decision platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "torch>=2.2,<3",
]


[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
